name=PropertiesConfig
property.filename=target/automation.log
# Console Appender
appender.console.type=Console
appender.console.name=STDOUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} %-5p - %m%n
# Rolling File Appender
appender.rolling.type=RollingFile
appender.rolling.name=RollingFile
appender.rolling.fileName=${filename}
appender.rolling.filePattern=target/logs/$${date:yyyy-MM}/app-%d{MM-dd-yyyy}-%i.log.gz
appender.rolling.layout.type=PatternLayout
appender.rolling.layout.pattern=%d{yyyy-MM-dd HH:mm:ss} %-5p - %m%n
# Rolling Policies
appender.rolling.policies.type=Policies
appender.rolling.policies.size.type=SizeBasedTriggeringPolicy
appender.rolling.policies.size.size=5MB
# Rollover Strategy
appender.rolling.strategy.type=DefaultRolloverStrategy
appender.rolling.strategy.max=10
# Custom Logger
logger.jamber.name=jamber
logger.jamber.level=info
logger.jamber.additivity=false
logger.jamber.appenderRef.rolling.ref=RollingFile
# Root Logger
rootLogger.level=info
rootLogger.appenderRef.stdout.ref=STDOUT
rootLogger.appenderRef.rolling.ref=RollingFile
