platformName=iOS
appium:automationName=XCUITest
# Changed to a standard, universally available runner simulator
appium:deviceName=iPhone 15
appium:app=src/test/resources/SaladShowcase.app
appium:noReset=true
# The CI workflow boots the simulator headlessly via `simctl boot` (no Simulator.app
# window). Without this flag the driver would see "booted but UI not visible", shut the
# device down and re-boot it with a UI just to hit its hardcoded 120s boot timeout on
# slow runners. Headless mode reuses the already-booted device and skips that wait.
appium:isHeadless=true

# Xcode compiles WebDriverAgent slowly the first time on CI runners
appium:wdaLaunchTimeout=300000
appium:wdaStartupRetries=4
# Safety net for the (rare) case the pre-booted simulator is gone and the driver has to
# boot it itself: the driver's hardcoded default is only 120s, too short for CI runners.
appium:simulatorStartupTimeout=300000
appium:newCommandTimeout=120
