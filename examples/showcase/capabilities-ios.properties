platformName=iOS
appium:automationName=XCUITest
# Changed to a standard, universally available runner simulator
appium:deviceName=iPhone 15
appium:app=src/test/resources/SaladShowcase.app
appium:noReset=true

# Xcode compiles WebDriverAgent slowly the first time on CI runners
appium:wdaLaunchTimeout=300000
appium:wdaStartupRetries=4
appium:newCommandTimeout=120
