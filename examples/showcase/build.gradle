plugins {
    id 'java'
    id 'com.adarshr.test-logger' version '4.0.0'
}

group = 'salad'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.25.2'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.2'
}

testlogger {
    theme 'mocha'
    showStandardStreams true
    showPassedStandardStreams false
    showSkippedStandardStreams false
    showFailedStandardStreams true
}

// One test task per Android driver. Select with e.g.:
//   ./gradlew uiautomator2Test
//   ./gradlew espressoTest
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

tasks.register('uiautomator2Test', Test) {
    description = 'Run showcase tests against the UiAutomator2 driver'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'driver', 'UIAUTOMATOR2'
    filter {
        includeTestsMatching 'android.uiautomator2.tests.*'
    }
    // Always re-run; each driver starts its own Appium session
    outputs.upToDateWhen { false }
}

tasks.register('espressoTest', Test) {
    description = 'Run showcase tests against the Espresso driver'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'driver', 'ESPRESSO'
    filter {
        includeTestsMatching 'android.espresso.tests.*'
    }
    outputs.upToDateWhen { false }
}

// iOS/XCUITest requires a macOS runner with a simulator; not part of the Linux workflow.
//   ./gradlew iosTest
tasks.register('iosTest', Test) {
    description = 'Run showcase tests against the XCUITest driver (macOS + simulator only)'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'driver', 'XCUITEST'
    filter {
        includeTestsMatching 'ios.tests.*'
    }
    outputs.upToDateWhen { false }
}
