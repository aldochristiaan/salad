<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Salad Showcase WebView</title>
    <style>
        body { font-family: sans-serif; margin: 16px; }
        h1 { color: #6200EE; }
        input, button { font-size: 16px; padding: 8px; margin-top: 8px; width: 100%; box-sizing: border-box; }
        #result { margin-top: 16px; font-weight: bold; color: #3700B3; }
        .spacer { height: 800px; }
    </style>
</head>
<body>
    <h1 id="web_title">Salad WebView Demo</h1>
    <p id="web_description">A simple page to showcase webAtoms and web context switching.</p>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button id="submit_btn" type="button">Submit</button>
    <div id="result"></div>

    <p>
        <a id="link_one" href="#web_title">Back to top</a>
    </p>

    <div class="spacer"></div>

    <h2 id="bottom_section">Bottom Section</h2>
    <p id="bottom_text">You reached the bottom of the page.</p>
</body>
</html>
