name: Run UI Test

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

# Least privilege + cancel superseded runs on the same ref
permissions:
  contents: read

concurrency:
  group: ui-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin Appium + drivers so an upstream release can't silently break CI
  APPIUM_VERSION: '3.1.1'
  UIAUTOMATOR2_VERSION: '7.1.1'
  ESPRESSO_VERSION: '8.1.0'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
            target: aosp_atd
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Appium
        run: |
          npm i -g appium@${{ env.APPIUM_VERSION }}
          appium driver install uiautomator2@${{ env.UIAUTOMATOR2_VERSION }}
          appium driver install espresso@${{ env.ESPRESSO_VERSION }}
          # Doctor is diagnostic only (the emulator isn't installed yet), so keep it non-fatal
          appium driver doctor uiautomator2 || echo "::warning::uiautomator2 doctor reported issues"
          appium driver doctor espresso || echo "::warning::espresso doctor reported issues"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Salad library
        run: ./gradlew shadowJar

      - name: Prepare showcase test project
        run: |
          # Fat jar for the showcase tests + the committed showcase APK.
          # Replace (don't accumulate) jars so fileTree never sees duplicate classes.
          rm -f examples/showcase/libs/*.jar
          cp build/libs/salad-*.jar examples/showcase/libs/
          cp examples/apk/showcase-android-debug.apk examples/showcase/src/test/resources/

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: stable
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # One emulator session runs both driver suites back-to-back to avoid re-booting the
      # emulator for each driver.
      - name: Showcase UI tests (UiAutomator2 + Espresso)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: stable
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Invoke Gradle from the repo root with -p so the subproject is targeted
          # explicitly; an inline `cd` is not reliably honored by emulator-runner.
          script: |
            set -e
            echo "===== UiAutomator2 showcase ====="
            ./gradlew -p examples/showcase uiautomator2Test
            echo "===== Espresso showcase ====="
            ./gradlew -p examples/showcase espressoTest

      - name: Upload test reports and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-test-artifacts-${{ matrix.api-level }}
          path: |
            examples/showcase/build/reports/tests/
            examples/showcase/target/
            examples/showcase/screenshot/
          if-no-files-found: ignore
